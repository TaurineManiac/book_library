spring:
  liquibase:
    enabled: true
    # Проверьте, что путь в точности совпадает с папкой в main/resources
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      # Возвращаем validate, чтобы убедиться, что таблицу создал Liquibase
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true