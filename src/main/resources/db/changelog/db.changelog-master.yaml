databaseChangeLog:
  #What it is: This is the root element. The entire file must be wrapped in this tag.
  #Purpose: It tells Liquibase: "Everything that follows is a set of instructions for database changes."
  #Without this line, the file is just plain text that the program cannot process.
  - include:
      #Purpose: This is a modularity mechanism. Imagine you have 500 migrations.
      #If you cram them all into a single file, it becomes unreadable. The include tag allows you to connect external files.
      file: db/changelog/changesets/01-create-books-table.yaml
      #path to migration from resources
  - include: 
      file: db/changelog/changesets/02-create-users-table.yaml