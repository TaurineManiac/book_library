databaseChangeLog:
  - changeSet:
      id: 01-create-books-table
      author: TaurineManiac
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: books
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: release_date
                  type: date